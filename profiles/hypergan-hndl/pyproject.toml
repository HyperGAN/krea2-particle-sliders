[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "krea2-particle-sliders"
version = "0.3.0.dev1"
description = "Krea2 exact local HyperGAN HNDL integration candidate; GPU unqualified"
readme = "LIFECYCLE.md"
requires-python = ">=3.11,<3.15"
license = {file = "LICENSE"}
dependencies = [
    "particle-sliders-core[hypergan-hndl] @ git+https://github.com/HyperGAN/particle-sliders.git@3dd672a7f9b8c169daef90fd63e4bb42b9ddc423#subdirectory=packages/particle-sliders-core",
    "PyYAML>=6",
]

[project.optional-dependencies]
native = ["diffusers>=0.40.0.dev0", "peft>=0.20,<1", "transformers>=5.15,<6", "torchvision>=0.21,<1", "safetensors>=0.4,<1", "Pillow>=13.0.0", "numpy"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["krea2*", "configs.krea2*"]
namespaces = true

[tool.setuptools.package-data]
"krea2" = ["shared.lock.json"]
"krea2_hndl" = ["core.lock.json"]
"configs.krea2" = ["*.yaml", "*.json"]

[project.entry-points."particle_sliders.image_backends"]
krea2-hndl = "krea2_hndl.lifecycle:BACKEND"

[project.entry-points."particle_sliders.inference_backends"]
krea2-hndl = "krea2_hndl.native_inference:BACKEND"
