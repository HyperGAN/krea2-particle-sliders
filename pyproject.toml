[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "krea2-particle-sliders"
version = "0.2.0"
description = "Krea2 native conditional GAN slider product"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
    "particle-sliders-core @ git+https://github.com/HyperGAN/particle-sliders.git@4be0b5b29d2e2c741431f468d71ba8a7c884b724#subdirectory=packages/particle-sliders-core",
    "PyYAML>=6",
]

[project.optional-dependencies]
native = ["diffusers>=0.40.0.dev0", "peft>=0.20,<1", "safetensors>=0.4,<1", "Pillow", "numpy"]
test = ["pytest>=8"]

[project.scripts]
krea2-train = "krea2.train:main"
krea2-infer = "krea2.infer:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["krea2*", "configs.krea2*"]
namespaces = true

[tool.setuptools.package-data]
"krea2" = ["shared.lock.json"]
"configs.krea2" = ["*.yaml", "*.json"]
