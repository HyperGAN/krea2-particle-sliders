# Distilled smile card. Not a tuned schedule and not a trained weight.
prompts_file: "configs/krea2/prompts-smile.yaml"
pretrained_model:
  name_or_path: "jimmycarter/krea2-turbo-bbox"
  subfolder: "epoch-14-step-73184/transformer"
  transformer_subfolder: "epoch-14-step-73184/transformer"
  pipeline_id: "krea/Krea-2-Raw"
  skeleton: "krea/Krea-2-Raw"
  comfy_filename: "krea2-bbox-turbo-comfy-latest.safetensors"
  is_distilled: true
  v2: false
  v_pred: false
network:
  type: "lora"
  rank: 16
  alpha: 16.0
  lora_targets: "dit"
  training_method: "lora"
train:
  precision: "bfloat16"
  iterations: 800
  lr: 0.0001
  optimizer: "AdamW"
  resolution: 512
  hold_weight: 0.1
save:
  name: "smile-krea2-bbox"
  path: "models/krea2-bbox-slider"
  per_steps: 50
  precision: "float32"
logging:
  use_wandb: false
  verbose: false
sample:
  mode: turbo
  steps: 8
  guidance: 0.0
  mu: 1.15
  turbo_steps: 8
  turbo_guidance: 0.0
  raw_steps: 28
  raw_guidance: 4.5
  scales: [0.0, 0.25, 0.5, 1.0]
  control_prompt: "a bowl of fruit on a table"
