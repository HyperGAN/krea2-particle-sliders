[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "krea2-strict-native-candidate"
version = "0.1.0"
description = "Separate strict BF16/math-SDPA Krea2 native source cohort; GPU qualification pending"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {file = "LICENSE"}
dependencies = [
  "krea2-particle-sliders @ git+https://github.com/HyperGAN/krea2-particle-sliders.git@9d3ad435daa230fe7746bc0888abad8fcf2a7913",
  "diffusers @ git+https://github.com/huggingface/diffusers.git@d5baa4fb548294f47dbca49890abd4b291204c60",
  "torch==2.9.1", "torchvision==0.24.1", "transformers==5.15.0",
  "peft==0.20.0", "accelerate==1.15.0", "safetensors==0.8.0",
  "Pillow==13.0.0", "numpy==2.5.4", "huggingface-hub==1.33.0", "tokenizers==0.22.2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "build>=1"]

[project.entry-points."particle_sliders.image_backends"]
krea2-native-strict = "krea2_strict.lifecycle:BACKEND"

[project.entry-points."particle_sliders.inference_backends"]
krea2-native-strict = "krea2_strict.inference:BACKEND"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
krea2_strict = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
